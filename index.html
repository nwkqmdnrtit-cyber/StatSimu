<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xen Rebirth Status Simulator</title>
</head>

<body>

    <h1>Xen Rebirth Status Simulator</h1>


    <!-- 基本職系統 -->
    <label for="jobType">基本職系統：</label>

    <select id="jobType">

        <option value="">-- 系統を選択 --</option>

        <option value="knight">Knight</option>
        <option value="rogue">Rogue</option>
        <option value="mage">Mage</option>
        <option value="cleric">Cleric</option>
        <option value="archer">Archer</option>
        <option value="templar">Templar</option>

    </select>


    <br>
    <br>


    <!-- クラス -->
    <label for="job">クラス：</label>

    <select id="job" disabled>

        <option value="">
            -- まず系統を選択 --
        </option>

    </select>


    <br>
    <br>


    <!-- 選択したクラス -->
    <p>
        選択したクラス：
        <span id="selectedJob">なし</span>
    </p>


    <!-- 基本ステータス -->
    <p>
        STR：
        <span id="strValue">-</span>
    </p>


    <script>


        /*
         * ========================================
         * クラスデータ
         * ========================================
         */

        const jobData = {

            knight: [
                "Squire",
                "Knight",
                "Warrior",
                "Warlord"
            ],

            rogue: [
                "Neophyte",
                "Rogue",
                "Assassin",
                "Shadow_Master"
            ],

            mage: [
                "Apprentice",
                "Mage",
                "Wizard",
                "Archmage"
            ],

            cleric: [
                "Acolyte",
                "Cleric",
                "Priest",
                "Paladin"
            ],

            archer: [
                "Scout",
                "Archer",
                "Ranger",
                "Archer_Lord"
            ],

            templar: [
                "Disciple",
                "Templar",
                "Holy_Avanger",
                "Saint_Guardian"
            ]

        };


        /*
         * ========================================
         * HTML要素
         * ========================================
         */

        const jobTypeSelect =
            document.getElementById("jobType");

        const jobSelect =
            document.getElementById("job");

        const selectedJob =
            document.getElementById("selectedJob");

        const strValue =
            document.getElementById("strValue");


        /*
         * ========================================
         * 基本職系統を選択
         * ========================================
         */

        jobTypeSelect.addEventListener(
            "change",
            function () {

                const selectedType =
                    jobTypeSelect.value;


                // クラス欄をリセット
                jobSelect.innerHTML = "";

                selectedJob.textContent =
                    "なし";

                strValue.textContent =
                    "-";


                // 系統が未選択
                if (selectedType === "") {

                    jobSelect.disabled = true;

                    const option =
                        document.createElement("option");

                    option.textContent =
                        "-- まず系統を選択 --";

                    jobSelect.appendChild(option);

                    return;
                }


                // クラス欄を有効化
                jobSelect.disabled = false;


                // 最初の案内
                const firstOption =
                    document.createElement("option");

                firstOption.value = "";

                firstOption.textContent =
                    "-- クラスを選択 --";

                jobSelect.appendChild(firstOption);


                // 該当するクラスを追加
                jobData[selectedType].forEach(
                    function (job) {

                        const option =
                            document.createElement("option");

                        option.value = job;

                        option.textContent = job;

                        jobSelect.appendChild(option);

                    }
                );

            }
        );


        /*
         * ========================================
         * クラスを選択
         * ========================================
         */

        jobSelect.addEventListener(
            "change",
            async function () {

                // クラス未選択
                if (jobSelect.value === "") {

                    selectedJob.textContent =
                        "なし";

                    strValue.textContent =
                        "-";

                    return;
                }


                const className =
                    jobSelect.value;


                const jobType =
                    jobTypeSelect.value;


                // 選択したクラスを表示
                selectedJob.textContent =
                    jobSelect.options[
                        jobSelect.selectedIndex
                    ].text;


                // 読み込み中
                strValue.textContent =
                    "読み込み中...";


                /*
                 * ========================================
                 * Supabase APIへ問い合わせ
                 * ========================================
                 */

                try {

                    const response =
                        await fetch(
                            "https://vlskdwruzfribwufxkbn.supabase.co/functions/v1/get-job-data",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    job_type:
                                        jobType,

                                    class_name:
                                        className

                                })

                            }
                        );


                    /*
                     * HTTPエラー確認
                     */

                    if (!response.ok) {

                        throw new Error(
                            "HTTP Error: " +
                            response.status
                        );

                    }


                    /*
                     * Supabaseから返ってきたJSON
                     */

                    const data =
                        await response.json();


                    /*
                     * デバッグ用
                     *
                     * 今はSupabaseから返ってきた
                     * データをそのまま表示します。
                     */

                    strValue.textContent =
                        JSON.stringify(data);


                    /*
                     * ブラウザのConsoleにも表示
                     */

                    console.log(
                        "Supabase response:",
                        data
                    );


                } catch (error) {

                    console.error(
                        "Supabase error:",
                        error
                    );


                    /*
                     * エラー内容を画面に表示
                     */

                    strValue.textContent =
                        "取得失敗: " +
                        error.message;

                }

            }
        );


    </script>

</body>

</html>
